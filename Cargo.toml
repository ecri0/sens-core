[package]
name = "sens-core"
version = "0.5.0"
edition = "2021"
description = "High-performance document processing for AI pipelines"
license = "Apache-2.0"
repository = "https://github.com/ecri0/sens-core"
keywords = ["pdf", "nlp", "sanitizer", "ai", "document-processing"]
categories = ["text-processing", "parser-implementations"]
authors = ["ecri0"]
readme = "README.md"

[dependencies]
lopdf = "0.32"
aho-corasick = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }
sha2 = "0.10"
regex = "1.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "pdf_extraction"
harness = false

[[bench]]
name = "sanitizer"
harness = false
